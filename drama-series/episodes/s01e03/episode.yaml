# הירוקים | פרק 03 | בלי עתיד
# מרנדרים:  python3 engine/reel.py episodes/s01e03
# זמנים: "L3:שודים" = הרגע שבו המילה נאמרת · "L8:בלי#3" = ה"בלי" השלישי בשורה 8 · "S02" = תחילת שוט

season: 1
episode: 3
title: "בלי עתיד"
output_name: "episode-03"

style:
  punch: 0.35                 # יותר דרמה: קונטרסט חזק, צללים עמוקים, פחות צבע
  vignette: 1.35              # שוליים כהים יותר

# ------------------------------------------------------------------ קריינות (אותו קול של דין)
# כתוביות: *מילה* = הדגשה (הראשונה "קופצת"), ^מילה^ = ירוק הסדרה רק במופע הזה
narration:
  voice: {provider: "Higgsfield · ElevenLabs v4", name: "Orion", voice_id: "ed69c516-92d2-4b30-a967-617737a342e5", stability: 0.35}
  # גרסה 2: הקלטה דרמטית יותר, עם הנחיית הגשה לכל שורה (בסוגריים המרובעים, לא נקראת בקול).
  # גרסה 1 שמורה ב-voice_raw/v1/
  start: 0.35                 # פותחים ישר בסיפור
  gap: 0.55
  lines:
    - id: L1
      audio: voice_raw/line1.mp3
      text: "אחרי שהבנתי שאני פשוט אוהב לעשן, / החלטתי שבא לי כל היום רק לעשן. / וזה מה שקרה. / בית ספר לא בא בחשבון."
      captions: "אחרי שהבנתי שאני | פשוט אוהב *לעשן,* | החלטתי שבא לי | כל היום רק *לעשן.* | וזה מה *שקרה.* | בית ספר | לא בא *בחשבון.*"
      pause_before: {"בית": 0.15}         # לתת ל"וזה מה שקרה" לנחות
      direction: "[low, serious voice, slow and deliberate]"

    - id: L2
      audio: voice_raw/line2.mp3
      text: "הייתי עובד בשתי עבודות, / מהבוקר עד הערב. / שליח פיצה / ומוכר במכולת. / כסף? / לא הייתה בעיה. / היה לי המון כסף."
      splits: [1.895, 3.545, 4.81, 6.24, 7.245, 8.47]
      direction: "[low, tense voice, measured]"
      captions: "הייתי עובד | בשתי *עבודות,* | מהבוקר עד *הערב.* | *שליח* פיצה | ומוכר *במכולת.* | *כסף?* | לא הייתה *בעיה.* | היה לי *המון* כסף."
      gap: 0.6
      pause_before: {"לא": 0.2}           # חצי פעימה אחרי "כסף?"

    - id: L3
      audio: voice_raw/line3.mp3
      text: "בגלל שעזבתי את בית הספר, / הייתי כל היום מסתובב עם אנשים מפוקפקים. / מהמרים כל היום, / עושים שודים קטנים. / אז זה לא נראה לי כזה סיפור."
      captions: "בגלל שעזבתי | את בית *הספר,* | הייתי כל היום מסתובב | עם אנשים *מפוקפקים.* | *מהמרים* כל היום, | עושים *שודים* קטנים. | אז זה לא נראה לי | כזה *סיפור.*"
      pause_before: {"אז": 0.1}
      direction: "[low, ominous voice]"

    - id: L4
      audio: voice_raw/line4.mp3
      text: "ואז חבר הכיר לי / חבר׳ה שלו / מצפון תל אביב. / הם שינו לי את החיים לגמרי."
      tts: "ואז חבר הכיר לי, חֶבְרֶ'ה שלו, מצפון תל אביב. הם שינו לי את החיים לגמרי."   # פסיקים קצרים סביב "חבר׳ה" כדי שיישמע ברור
      direction: "[in a low, serious, tense voice]"
      captions: "ואז חבר | הכיר לי חבר׳ה שלו | *מצפון* *תל* *אביב.* | הם שינו לי | את החיים *לגמרי.*"
      gap: 0.7

    - id: L5
      audio: voice_raw/line5.mp3
      gap: 1.2                             # פעימה על המבט של דין לפני חשיפת האוטו
      text: "בדיוק באותה תקופה הוצאתי רישיון וקניתי לי ב.מ.וו יפהפייה. / לא חדשה כל כך, / אבל עשתה את העבודה."
      direction: "[low voice, with quiet pride]"
      captions: "בדיוק באותה תקופה | הוצאתי *רישיון* | וקניתי לי | *ב.מ.וו* יפהפייה. | לא חדשה כל כך, | אבל עשתה את *העבודה.*"

    - id: L6
      audio: voice_raw/line6.mp3
      gap: 1.0                             # רגע של גאווה
      direction: "[low, tense voice, dry and almost amused at the very end]"
      text: "והתחלתי להסתובב עם החבר׳ה האלה מצפון תל אביב. / הייתי מעביר להם כמויות של גראס. / הם היו מתים על עישונים. / והסחורה, / בהשוואה להיום, / הייתה זבל שבזבל."
      captions: "והתחלתי להסתובב | עם החבר׳ה האלה | *מצפון* *תל* *אביב.* | הייתי *מעביר* להם | כמויות של *גראס.* | הם היו *מתים* | על עישונים. | והסחורה, בהשוואה להיום, | הייתה *זבל* שבזבל."

    - id: L7
      audio: voice_raw/line7.mp3
      gap: 0.6
      direction: "[quiet, nostalgic voice]"
      text: "אני זוכר, / היינו מוציאים ממנה זרעים שעות. / אבל זאת הייתה תקופה יפה. / היינו כל היום מושכים באנגים, / מעושנים."
      captions: "אני *זוכר,* | היינו מוציאים ממנה | *זרעים* שעות. | אבל זאת הייתה | תקופה *יפה.* | היינו כל היום | מושכים *באנגים,* | מעושנים."

    - id: L8
      audio: voice_raw/line8.mp3
      gap: 1.4                             # רגע שקט בחדר לפני השמש בחוץ
      text: "מטיילים בנתניה עם משקפי שמש. / בלי צרות. / בלי דאגות. / בלי עתיד."
      captions: "מטיילים *בנתניה* | עם משקפי שמש. | בלי *צרות.* | בלי *דאגות.* | ^בלי^ ^*עתיד.*^"
      splits: [2.9, 4.36, 5.86]           # נבדק ידנית: בהקלטה יש נשימות בין המשפטים
      gain_db: 2
      pause_before: {"בלי#3": 0.35}       # לפני "בלי עתיד" המוזיקה נעצרת
      direction: "[quiet and slow, the last words heavy with regret]"

marks:
  nofuture: "L8:בלי#3-0.4"       # כאן נעצרת המוזיקה: הקול של דין לבד
  blackout: "L8:end+0.6"         # חצי פעימה ואז שחור

blackout: blackout
blackout_fade: 0

title_card: {at: 0.2, until: 3.6}

# ------------------------------------------------------------------ שוטים
shots:
  - id: S01                      # שער בית הספר: התקרבות איטית לשער הנעול
    image: images/01-school-gate.png
    at: 0
    grade: warm
    haze: 0.15
    effects: [drift]
    cam:
      - {t: 0, c: [0.50, 0.55], z: 1.02}
      - {t: S02, c: [0.47, 0.58], z: 1.24}

  - id: S02                      # שליח פיצה: מהפנים, ונפתח לקופסאות ולקטנוע על "שליח פיצה"
    image: images/02-pizza-scooter.png
    at: "L1:end+0.15"
    grade: warm
    haze: 0.15
    cam:
      - {t: S02, c: [0.56, 0.30], z: 1.7}
      - {t: "L2:שליח-0.1", c: [0.56, 0.32], z: 1.62}
      - {t: "L2:שליח+0.9", c: [0.50, 0.55], z: 1.03, ease: out}
      - {t: S03, c: [0.50, 0.55], z: 1.07}

  - id: S03                      # מוכר במכולת: אור ערב; התקרבות לשטרות ולקופה אחרי "כסף?"
    image: images/03-counting-till.png
    at: "L2:ומוכר"
    grade: warm_clean
    exposure: 0.92
    cam:
      - {t: S03, c: [0.45, 0.50], z: 1.06}
      - {t: "L2:לא-0.05", c: [0.47, 0.52], z: 1.10}
      - {t: "L2:לא+0.7", c: [0.60, 0.68], z: 1.6, ease: out}
      - {t: S04, c: [0.60, 0.68], z: 1.66}

  - id: S04                      # שולחן הקלפים: הפנים של דין
    image: images/04-cards.png
    at: "L3:start-0.1"
    grade: warm_clean
    exposure: 0.85
    effects: [drift]
    cam:
      - {t: S04, c: [0.53, 0.35], z: 1.55}
      - {t: S04B, c: [0.53, 0.37], z: 1.6}

  - id: S04B                     # "מהמרים": פרט הקלפים
    image: images/04-cards.png
    at: "L3:מהמרים"
    grade: warm_clean
    exposure: 0.85
    effects: [drift]
    cam:
      - {t: S04B, c: [0.42, 0.66], z: 1.9}
      - {t: S04C, c: [0.44, 0.66], z: 2.0}

  - id: S04C                     # "שודים קטנים": הצד החשוך של החדר, ואז נפתח לשולחן
    image: images/04-cards.png
    at: "L3:שודים"
    grade: warm_clean
    exposure: 0.85
    effects: [drift]
    cam:
      - {t: S04C, c: [0.75, 0.30], z: 1.8}
      - {t: "L3:אז", c: [0.72, 0.32], z: 1.75}
      - {t: S05, c: [0.55, 0.45], z: 1.1}

  - id: S05                      # צפון תל אביב: לחיצת היד והפנים בפריים אחד, ואז פעימה על המבט של דין
    image: images/05-north-tlv-meeting.png
    at: "L4:start-0.1"
    transition: "flash:0.35"
    grade: warm
    cam:
      - {t: S05, c: [0.48, 0.42], z: 1.06}
      - {t: "L4:end", c: [0.42, 0.38], z: 1.14}
      - {t: S06, c: [0.30, 0.30], z: 1.3}

  - id: S06                      # הב.מ.וו: מהפנס לדין, החשיפה על "ב.מ.וו", רגע של גאווה
    image: images/06-bmw-pride.png
    at: "L5:start-0.1"
    grade: warm
    caption_y: 1560
    cam:
      - {t: S06, c: [0.78, 0.20], z: 1.9}
      - {t: "L5:ב.מ.וו-0.15", c: [0.68, 0.30], z: 1.7}
      - {t: "L5:ב.מ.וו+0.9", c: [0.50, 0.55], z: 1.0, ease: out}
      - {t: "L5:עשתה", c: [0.52, 0.52], z: 1.02}
      - {t: S07, c: [0.62, 0.36], z: 1.25}

  - id: S07                      # אותה ב.מ.וו בצפון תל אביב, ערב: השקית נכנסת לעין על "מעביר להם"
    image: images/07-bag-by-bmw.png
    at: "L6:start-0.1"
    grade: cool
    exposure: 1.05
    effects: [drift]
    cam:
      - {t: S07, c: [0.50, 0.42], z: 1.08}
      - {t: "L6:מעביר-0.1", c: [0.50, 0.44], z: 1.10}
      - {t: "L6:מעביר+0.9", c: [0.50, 0.46], z: 1.3, ease: out}
      - {t: S08, c: [0.50, 0.46], z: 1.36}

  - id: S08                      # מיד אחרי "זבל שבזבל": הבזק של הזרעים
    image: images/08-seeds-closeup.png
    at: "L6:end+0.08"
    grade: warm_clean
    caption_y: 1560
    cam:
      - {t: S08, c: [0.45, 0.62], z: 1.12}
      - {t: S08B, c: [0.43, 0.64], z: 1.22}

  - id: S08B                     # "היינו מוציאים ממנה זרעים שעות"
    image: images/08b-seeds-table.png
    at: "L7:היינו"
    grade: warm_clean
    cam:
      - {t: S08B, c: [0.50, 0.50], z: 1.05}
      - {t: S09, c: [0.48, 0.52], z: 1.12}

  - id: S09                      # "אבל זאת הייתה תקופה יפה": החדר האפלולי, העשן באור החלון
    image: images/09-amber-night.png
    at: "L7:אבל"
    grade: amber
    exposure: 0.95
    effects: [drift]
    cam:
      - {t: S09, c: [0.55, 0.45], z: 1.05}
      - {t: S10, c: [0.60, 0.40], z: 1.13}

  - id: S10                      # משקפי השמש: בלי צרות. בלי דאגות. בלי עתיד.
    image: images/10-sunglasses-walk.png
    at: "L8:start-0.15"
    grade: warm
    haze: 0.15
    cam:
      - {t: S10, c: [0.50, 0.45], z: 1.05}
      - {t: blackout, c: [0.50, 0.38], z: 1.15}

# ------------------------------------------------------------------ סאונד
music:
  bpm: 92
  gain: 0.3
  sections:
    - {style: dark,    from: 0,              to: S02, gain: 0.8}                  # פתיחה כבדה
    - {style: pulse,   from: S02,            to: S04, grid: S02}                  # העבודות והכסף, עם זרם מתח מתחת
    - {style: tension, from: S04,            to: S05, grid: S04, gain: 0.75}      # אנשים מפוקפקים
    - {style: pulse,   from: S05,            to: S09, grid: S05}                  # צפון תל אביב, הב.מ.וו, העסקה: המתח נבנה
    - {style: warm,    from: S09,            to: S10, gain: 0.4}                  # רגע שקט בחדר
    - {style: pulse,   from: S10,            to: nofuture, grid: S10}             # השמש בחוץ, ואז עצירה מוחלטת
  events:
    - {kind: stop, at: "L2:לא-0.25", until: "L2:לא-0.02"}                        # חצי פעימה אחרי "כסף?"

sfx:
  - {kind: street,        at: 0,                 until: S02, gain: 0.1, fade_in: 0.3}
  - {kind: scooter_start, at: "S02-0.05",        gain: 0.28}
  - {kind: street,        at: S02,               until: S03, gain: 0.13, fade_out: 0.1}
  - {kind: room_tone,     at: S03,               until: S04, gain: 0.15}
  - {kind: register,      at: "L2:לא+0.12",      gain: 0.4}
  - {kind: room_tone,     at: S04,               until: S05, gain: 0.18}
  - {kind: clank,         at: "L3:שודים+0.05",   gain: 0.35}
  - {kind: hit,           at: "L3:שודים",        pitch: 0.9, gain: 0.26}
  - {kind: riser,         at: S05,               dur: 2.2, gain: 0.2}        # נבנה אל ההיכרות
  - {kind: hit,           at: S05,               gain: 0.32}
  - {kind: street,        at: S05,               until: S06, gain: 0.22, fade_out: 0.2}
  - {kind: keys,          at: "L5:ב.מ.וו",       gain: 0.35}
  - {kind: riser,         at: "L5:ב.מ.וו",       dur: 2.0, gain: 0.17}       # נבנה אל חשיפת הב.מ.וו
  - {kind: hit,           at: "L5:ב.מ.וו",       gain: 0.28}
  - {kind: street,        at: S06,               until: S07, gain: 0.14, fade_in: 0.4}
  - {kind: room_tone,     at: S07,               until: S08, gain: 0.12}
  - {kind: crinkle,       at: "L6:מעביר+0.25",   gain: 0.25}
  - {kind: heartbeat,     at: S07,               until: "L6:end", bpm: 78, gain: 0.2}   # דופק מתחת לעסקה
  - {kind: hit,           at: S08,               pitch: 0.8, gain: 0.26}
  - {kind: room_tone,     at: S08,               until: S10, gain: 0.12}
  - {kind: bubbles,       at: "L7:באנגים",       dur: 1.5, gain: 0.12}
  - {kind: street,        at: S10,               until: nofuture, gain: 0.2, fade_in: 0.3, fade_out: 0.05}
  - {kind: steps_run,     at: "S10+0.2",         until: nofuture, rate: 1.9, gain: 0.2, fade_out: 0.05}
  - {kind: riser,         at: nofuture,          dur: 2.6, gain: 0.22}        # המתח נבנה... ונקטע לשקט
  - {kind: braam,         at: blackout,          gain: 0.55, through_black: true}   # בום כבד בקאט לשחור

duck:
  - {from: "L1:וזה-0.05", to: "L1:שקרה.end+0.1", level: 0.3}    # המוזיקה יורדת לרגע על "וזה מה שקרה"
  - {from: "L4:הם-0.1",   to: S06, level: 0.35}                  # רעש הרחוב יורד על "הם שינו לי את החיים"
  - {from: nofuture,      to: blackout, level: 0.0}              # "בלי עתיד": רק הקול של דין

endcard:
  at: "blackout+0.7"
  dur: 5.6

outro_logo:
  image: assets/logo-hayerukim.png
  dur: 3.8
  width: 900
  cy: 930
  hit_gain: 0.4
  fade_out: 1.1

cover: {shot: S06, time: "L5:עשתה"}
