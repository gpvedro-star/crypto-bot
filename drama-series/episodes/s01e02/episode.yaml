# הירוקים | פרק 02 | השטן הירוק
# מרנדרים:  python3 engine/reel.py episodes/s01e02
# זמנים: "L3:מסתובב" = הרגע שבו המילה נאמרת · "L1:end+0.6" = 0.6 שנ׳ אחרי סוף שורה 1 · "S02" = תחילת שוט

season: 1
episode: 2
title: "השטן הירוק"
output_name: "episode-02"

style:
  word_colors:
    "בשטן": "#33C761"          # "השטן הירוק" בירוק של הסדרה (הירוק כבר ירוק ב-series.yaml)

# ------------------------------------------------------------------ קריינות (אותו קול של דין מפרק 1)
narration:
  voice: {provider: "Higgsfield · ElevenLabs v4", name: "Orion", voice_id: "ed69c516-92d2-4b30-a967-617737a342e5"}
  start: 0.45                 # פותחים ישר על הצחוק ברחוב
  gap: 0.4
  lines:
    - id: L1
      audio: voice_raw/line1.mp3
      text: "אני לא אשכח את היום הזה לעולם. / טיילנו בעיר כל החבר׳ה, מסטולים בטירוף. / לא מפסיקים לצחוק, / לא מבינים למה כולם מסתכלים עלינו. / ובמקום להיות בבית ספר… / הלכנו לים."
      captions: "אני לא *אשכח* | את היום הזה *לעולם.* | טיילנו בעיר | כל החבר׳ה, *מסטולים* בטירוף. | לא מפסיקים *לצחוק,* | לא מבינים למה | *כולם* מסתכלים עלינו. | ובמקום להיות בבית *ספר…* | הלכנו *לים.*"
      splits: [2.275, 5.605, 7.065, 9.265, 11.205]   # נבדק: ההפסקות בהקלטה, כולל הפסיק אחרי "לצחוק,"
      pause_before: {"הלכנו": 0.33}                 # חצי פעימה לפני "הלכנו לים"

    - id: L2
      audio: voice_raw/line2.mp3
      gap: 0.35
      text: "בדרך עצרנו באיזו פיצוצייה וקנינו בקבוק וודקה. / שתינו את כולו. / ככה, / ישר מהבקבוק. / אצלנו לא היה אקסל ולא כל מיני ערבובים."
      captions: "בדרך עצרנו | באיזו *פיצוצייה* | וקנינו בקבוק *וודקה.* | שתינו את *כולו.* | ככה, ישר *מהבקבוק.* | אצלנו לא היה *אקסל* | ולא כל מיני ערבובים."
      splits: [3.71, 5.035, 5.665, 6.96]

    - id: L3
      audio: voice_raw/line3.mp3
      gap: 0.7
      tempo: 0.93                 # על החול הוא מדבר לאט יותר
      text: "אני לא אשכח איך שכבתי מסטול בטירוף על החול. / כל העולם מסתובב לי. / אני באפס דאגות. / אולי הבנאדם הכי מאושר בעולם."
      captions: "אני לא אשכח | איך שכבתי *מסטול* | בטירוף על *החול.* | כל העולם *מסתובב* לי. | אני באפס *דאגות.* | אולי הבנאדם | הכי *מאושר* בעולם."

    - id: L4
      audio: voice_raw/line4.mp3
      gap: 1.0                    # מחזיקים את החיוך אחרי "בעולם" עם הגלים
      text: "בחזור הלכנו לשלב. / הייתה לו בחדר מיטת קומותיים זוגית. / משהו שלא רואים היום בשום מקום. / אצל שלב הבית תמיד היה ריק. / אבא שלו חי בחו״ל. / אחותו הייתה כל היום בחדר שלה. / ואמא שלו? / רק אלוהים יודע איפה היא הייתה."
      captions: "בחזור הלכנו *לשלב.* | הייתה לו בחדר | מיטת *קומותיים* זוגית. | משהו שלא רואים | היום בשום *מקום.* | אצל שלב הבית | תמיד היה *ריק.* | אבא שלו חי *בחו״ל.* | *אחותו* הייתה כל היום | בחדר שלה. | ואמא *שלו?* | רק *אלוהים* יודע | איפה היא הייתה."
      pause_before: {"רק": 0.4}   # השאלה נשארת באוויר

    - id: L5
      audio: voice_raw/line5.mp3
      gap: 0.3
      tempo: 1.04                 # קצר וממוקד סביב השעון והדלת
      text: "נרדמנו על הקומותיים. / למזלי קמתי בסביבות שש בערב. / רצתי הביתה כאילו לא קרה כלום. / הספקתי להגיע לפני שההורים שלי חזרו מהעבודה."
      captions: "*נרדמנו* על הקומותיים. | למזלי קמתי | בסביבות *שש* בערב. | *רצתי* הביתה | כאילו לא קרה *כלום.* | *הספקתי* להגיע | לפני שההורים שלי | חזרו מהעבודה."

    - id: L6
      audio: voice_raw/line6.mp3
      gap: 0.6
      gain_db: -3                 # את המשפט האחרון הוא אומר בשקט
      text: "וככה התאהבתי. / התאהבתי בשטן הירוק."
      captions: "וככה *התאהבתי.* | התאהבתי *בשטן* הירוק."
      pause_before: {"התאהבתי": 0.35}

marks:
  blackout: "L6:end+1.0"         # מחזיקים את המבט של דין, ואז קאט לשחור

blackout: blackout
blackout_fade: 0

title_card: {at: 0.2, until: 3.8}

# ------------------------------------------------------------------ שוטים
shots:
  - id: S01                      # החבורה צוחקת ברחוב
    image: images/01-laughing-street.png
    at: 0
    grade: warm
    haze: 0.2
    cam:
      - {t: 0, c: [0.50, 0.60], z: 1.12}
      - {t: S01B, c: [0.50, 0.58], z: 1.18}

  - id: S01B                     # אותה תמונה: האנשים שמסתכלים מהצד, ואז הרחבה על "בית ספר"
    image: images/01-laughing-street.png
    at: "L1:כולם-0.05"
    grade: warm
    haze: 0.2
    cam:
      - {t: S01B, c: [0.10, 0.36], z: 2.2}
      - {t: "L1:בבית-0.05", c: [0.12, 0.37], z: 2.1}
      - {t: "L1:בבית+0.85", c: [0.50, 0.50], z: 1.0, ease: out}
      - {t: S02, c: [0.50, 0.49], z: 1.02}

  - id: S02                      # הפיצוצייה: התקרבות לבקבוק על "וודקה"
    image: images/02-bottle-counter.png
    at: "L1:end+0.12"
    grade: warm
    haze: 0.15
    cam:
      - {t: S02, c: [0.45, 0.45], z: 1.06}
      - {t: "L2:וודקה-0.05", c: [0.47, 0.50], z: 1.10}
      - {t: "L2:וודקה+0.6", c: [0.56, 0.67], z: 1.55, ease: out}
      - {t: S03, c: [0.56, 0.67], z: 1.62}

  - id: S03                      # המדרגות לים, על "ישר מהבקבוק"
    image: images/03-stairs-to-sea.png
    at: "L2:ישר"
    grade: warm
    haze: 0.2
    cam:
      - {t: S03, c: [0.47, 0.50], z: 1.05}
      - {t: S04, c: [0.47, 0.46], z: 1.12}

  - id: S04                      # דין על החול: הטיה איטית על "מסתובב לי", נרגע על "אפס דאגות"
    image: images/04-sand-tilted.png
    at: "L3:start-0.25"
    transition: "fade:0.6"
    grade: warm
    haze: 0.25
    cam:
      - {t: "S04-0.6", c: [0.45, 0.45], z: 1.30, r: 0}
      - {t: "L3:מסתובב-0.1", c: [0.45, 0.45], z: 1.33, r: 0}
      - {t: "L3:באפס", c: [0.45, 0.46], z: 1.36, r: 2.6}
      - {t: "L3:end", c: [0.45, 0.46], z: 1.38, r: 1.2}
      - {t: S05A, c: [0.45, 0.46], z: 1.39, r: 1.0}

  - id: S05A                     # החדר של שלב: שתי הקומות בפריים
    image: images/05-bunk-room.png
    at: "L4:start-0.12"
    grade: warm
    exposure: 0.78
    cam:
      - {t: S05A, c: [0.50, 0.45], z: 1.04}
      - {t: S06, c: [0.50, 0.44], z: 1.08}

  - id: S06                      # האחות בחדר שלה: התקרבות עדינה, האחות והדיסקמן בפריים
    image: images/06-sister-room.png
    at: "L4:אחותו"
    grade: warm
    exposure: 0.9
    haze: 0.1
    cam:
      - {t: S06, c: [0.62, 0.50], z: 1.04}
      - {t: S05B, c: [0.62, 0.50], z: 1.12}

  - id: S05B                     # "ואמא שלו?": חוזרים לחדר, השאלה באוויר
    image: images/05-bunk-room.png
    at: "L4:ואמא"
    grade: warm
    exposure: 0.78
    cam:
      - {t: S05B, c: [0.50, 0.45], z: 1.08}
      - {t: S07, c: [0.50, 0.45], z: 1.12}

  - id: S07                      # הבזק מהדמיון: האמא במלון
    image: images/07-mother-hotel.png
    at: "L4:רק"
    grade: amber
    note: {text: "ככה דמיינתי", at: "S07+0.2", y: 250, size: 92}
    cam:
      - {t: S07, c: [0.42, 0.42], z: 1.06}
      - {t: S05C, c: [0.42, 0.40], z: 1.12}

  - id: S05C                     # "נרדמנו": חזרה למיטת הקומותיים
    image: images/05-bunk-room.png
    at: "L5:start-0.08"
    grade: warm
    exposure: 0.78
    cam:
      - {t: S05C, c: [0.50, 0.45], z: 1.06}
      - {t: S08, c: [0.50, 0.45], z: 1.14}

  - id: S08                      # 18:00: הכתוביות גבוה כדי שהשעון יישאר גלוי
    image: images/08-wake-1800.png
    at: "L5:שש"
    grade: warm
    exposure: 0.95
    caption_y: 1080
    cam:
      - {t: S08, c: [0.55, 0.55], z: 1.04}
      - {t: S09, c: [0.56, 0.56], z: 1.10}

  - id: S09                      # הריצה הביתה
    image: images/09-dusk-sprint.png
    at: "L5:רצתי"
    grade: warm
    haze: 0.1
    effects: [handheld]
    cam:
      - {t: S09, c: [0.50, 0.45], z: 1.08}
      - {t: S10, c: [0.50, 0.43], z: 1.14}

  - id: S10                      # הדלת, ועד המבט של "השטן הירוק"
    image: images/10-door-home.png
    at: "L5:הספקתי"
    grade: warm
    exposure: 0.95
    cam:
      - {t: S10, c: [0.55, 0.45], z: 1.03}
      - {t: blackout, c: [0.60, 0.38], z: 1.16}

# ------------------------------------------------------------------ סאונד
music:
  bpm: 92
  gain: 0.44
  sections:
    - {style: groove, from: 0,              to: "S04+0.5", grid: 0, fade_out: 2.0}   # זיכרון קיץ מצחיק
    - {style: warm,   from: "S04-0.8",      to: S05A, gain: 0.55, fade_in: 1.5}      # בחוף הקצב מאט
    - {style: groove, from: S06,            to: S05B, grid: S06, gain: 0.12, highpass: 1800}   # דליפה מהאוזניות של האחות
    - {style: freeze, from: S07,            to: S05C, gain: 0.4, fade_in: 0.3}       # הבזק המלון
    - {style: tension, from: "L5:רצתי",     to: blackout, grid: "L5:רצתי", gain: 0.9, fade_in: 0.2}
    - {style: dark,   from: S10,            to: blackout, gain: 0.6, fade_in: 0.5}
  events:
    - {kind: stop, at: "L1:הלכנו-0.36", until: "L1:הלכנו-0.02"}                     # חצי פעימה של שקט

sfx:
  - {kind: street,      at: 0,                  until: "S03+2.5", gain: 0.26, fade_in: 0.3, fade_out: 2.5}
  - {kind: clink,       at: "L2:וודקה+0.1",     gain: 0.4}
  - {kind: waves,       at: "S03+0.2",          until: S05A, gain: 0.5, fade_in: 2.5, fade_out: 0.03}   # קאט לשקט של הדירה
  - {kind: room_tone,   at: S05A,               until: S08, gain: 0.18}
  - {kind: clock_click, at: "L5:שש-0.02",       gain: 0.45}
  - {kind: steps_run,   at: S09,                until: "S10+0.3", rate: 3.3, gain: 0.3, fade_out: 0.3}
  - {kind: breath,      at: "S09+0.2",          until: "L6:start", rate: 1.8, gain: 0.26, fade_out: 1.0}
  - {kind: handle,      at: "S10+0.55",         gain: 0.35}
  - {kind: room_tone,   at: S10,                until: blackout, gain: 0.1}

duck:
  - {from: S10, to: blackout, level: 0.3}       # מוזיקה נמוכה ליד הדלת: שומעים נשימה וידית

endcard:
  at: "blackout+0.7"
  dur: 5.4

outro_logo:
  image: assets/logo-hayerukim.png
  dur: 3.6
  width: 900
  cy: 930
  hit_gain: 0.4
  fade_out: 1.1

cover: {shot: S04, time: "L3:start+1.5"}
