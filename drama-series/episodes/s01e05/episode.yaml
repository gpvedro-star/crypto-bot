# הירוקים | פרק 05 | יום השחרור   (אחרי 2008, בלי שנה על המסך)
# מרנדרים:  python3 engine/reel.py episodes/s01e05
# שורות L1, L4, L7 עוד לא הוקלטו (מגבלה יומית ב-Higgsfield). עד שיגיעו הן "משבצות": התזמון מוערך
# מהטקסט. כשהקבצים voice_raw/line1.mp3, line4.mp3, line7.mp3 יגיעו, המנוע ישתמש בהם לבד וכל הקאטים יזוזו איתם.
# tts: הטקסט המדויק שנשלח להקלטה (ניקוד רק שם, הכתוביות בכתיב רגיל).

season: 1
episode: 5
title: "יום השחרור"
output_name: "episode-05"

style:
  punch: 0.25
  vignette: 1.25

# ------------------------------------------------------------------ קריינות
narration:
  voice: {provider: "Higgsfield · ElevenLabs v4", name: "Orion", voice_id: "ed69c516-92d2-4b30-a967-617737a342e5", stability: 0.35}
  start: 0.4                  # פותחים ישר על דין עם התיק
  gap: 0.6
  lines:
    - id: L1
      audio: voice_raw/line1.mp3
      direction: "[calm, reflective voice, slightly nostalgic]"
      tts: "הגיע היום להתגייס לצבא. רציתי ממש ללכת לִקְרָבִי. בסוף הגעתי לַקִּרְיָה. ומשם נפתחו לי החיים."
      placeholder: {cps: 10, pause: 0.5}
      text: "הגיע היום להתגייס לצבא. / רציתי ממש ללכת לקרבי. / בסוף הגעתי לקריה. / ומשם נפתחו לי החיים."
      captions: "הגיע היום | *להתגייס* לצבא. | רציתי ממש | ללכת *לקרבי.* | בסוף הגעתי | *לקריה.* | ומשם *נפתחו* | לי החיים."
      pause_before: {"בסוף": 0.45}   # חצי פעימה אחרי "לקרבי"

    - id: L2
      audio: voice_raw/line2.mp3
      gap: 1.0
      direction: "[nostalgic voice, with a dark half-smile]"
      tts: "כמות הבנות והאנשים האיכותיים שהכרתי שם הייתה מטורפת. ובמקום לְמַנֵּף את זה, הפכתי את כולם למכורים לַיָּרוֹק. פתחתי קו בתוך הבסיס, ולא רציתי לצאת משם. כל היום היינו מעשנים בבסיס, ואני הייתי עושה כסף מטורף."
      text: "כמות הבנות והאנשים האיכותיים שהכרתי שם הייתה מטורפת. / ובמקום למנף את זה, / הפכתי את כולם למכורים לירוק. / פתחתי קו בתוך הבסיס, ולא רציתי לצאת משם. / כל היום היינו מעשנים בבסיס, / ואני הייתי עושה כסף מטורף."
      captions: "כמות *הבנות* | והאנשים האיכותיים | שהכרתי שם | הייתה *מטורפת.* | ובמקום *למנף* את זה, | הפכתי את כולם | *למכורים* ^לירוק.^ | פתחתי *קו* | בתוך הבסיס, | ולא רציתי | לצאת משם. | כל היום היינו | *מעשנים* בבסיס, | ואני הייתי עושה | *כסף* *מטורף.*"

    - id: L3
      audio: voice_raw/line3.mp3
      gap: 2.6                  # המועדון והבס נכנסים לפני המשפט
      direction: "[warm and nostalgic, then slowing down and darker at the end]"
      tts: "ובערב הייתי יוצא לסבב מועדונים בתל אביב. זאת הייתה אחת התקופות היפות בחיים שלי. עד שהגיע הרגע ששינה הכול."
      text: "ובערב הייתי יוצא לסבב מועדונים בתל אביב. / זאת הייתה אחת התקופות היפות בחיים שלי. / עד שהגיע הרגע ששינה הכול."
      captions: "ובערב הייתי יוצא | לסבב *מועדונים* | בתל אביב. | זאת הייתה אחת | התקופות *היפות* | בחיים שלי. | עד שהגיע הרגע | *ששינה* *הכול.*"

    - id: L4
      audio: voice_raw/line4.mp3
      gap: 2.6                  # שקט של בוקר לפני המשפט
      direction: "[quiet, low voice, recalling]"
      tts: "חזרתי ממסיבה בתל אביב והלכתי לישון אצל מישהי בעיר. ולא קמתי לבסיס. המזל שלי היה שבאותו יום הייתה פְּשִׁיטָה על הבסיס, ועצרו את כל מי שהיה חשוד."
      placeholder: {cps: 10, pause: 0.5}
      text: "חזרתי ממסיבה בתל אביב והלכתי לישון אצל מישהי בעיר. / ולא קמתי לבסיס. / המזל שלי היה שבאותו יום הייתה פשיטה על הבסיס, / ועצרו את כל מי שהיה חשוד."
      captions: "חזרתי ממסיבה | בתל אביב | והלכתי לישון | אצל *מישהי* בעיר. | *ולא* *קמתי* *לבסיס.* | המזל שלי היה | שבאותו יום | הייתה *פשיטה* | על הבסיס, | ועצרו את כל | מי שהיה *חשוד.*"
      pause_before: {"ולא": 0.5, "המזל": 0.3}

    - id: L5
      audio: voice_raw/line5.mp3
      gap: 1.9                  # המגפיים במסדרון
      direction: "[tense, low, urgent voice]"
      tts: "פתאום מצאתי את עצמי בלב תל אביב, המשטרה הצבאית מחפשת אותי בְּנֵרוֹת, וכל, חֶבְרֶ'ה שלי, מהצבא עצורים. הלכתי זָרִיז לביקור רופא והוצאתי גִּימֶלִים. משכתי את זה כמעט חודש. הפסקתי לעשן כל התקופה הזאת."
      text: "פתאום מצאתי את עצמי בלב תל אביב, / המשטרה הצבאית מחפשת אותי בנרות, / וכל החבר׳ה שלי מהצבא עצורים. / הלכתי זריז לביקור רופא והוצאתי גימלים. / משכתי את זה כמעט חודש. / הפסקתי לעשן כל התקופה הזאת."
      captions: "פתאום מצאתי את עצמי | *בלב* *תל* *אביב,* | המשטרה הצבאית | מחפשת אותי *בנרות,* | וכל *החבר׳ה* שלי | מהצבא *עצורים.* | הלכתי זריז | לביקור *רופא* | והוצאתי *גימלים.* | משכתי את זה | *כמעט* *חודש.* | הפסקתי לעשן | כל התקופה הזאת."
      splits: [2.19, 4.33, 7.32, 10.13, 11.95]   # נבדק ידנית (אחרי "בנרות" יש נשימה)

    - id: L6
      audio: voice_raw/line6.mp3
      gap: 2.6                  # עצירה על הפריים: "כמעט חודש"
      direction: "[low, serious, tense voice]"
      tts: "ואז חזרתי לבסיס. איך שנכנסתי, לא עברה חצי שעה וקפצו עליי סְמוּיִים של המשטרה הצבאית. חקירות של עשר עד שֵׁשׁ עֶשְׂרֵה שעות בלי הפסקה. וּבְתַכְלֶ'ס, לא היה להם כלום עליי."
      text: "ואז חזרתי לבסיס. / איך שנכנסתי, / לא עברה חצי שעה וקפצו עליי סמויים של המשטרה הצבאית. / חקירות של עשר עד שש עשרה שעות בלי הפסקה. / ובתכל׳ס, / לא היה להם כלום עליי."
      captions: "ואז חזרתי *לבסיס.* | איך שנכנסתי, | *לא* *עברה* *חצי* *שעה* | וקפצו עליי *סמויים* | של המשטרה הצבאית. | חקירות של *עשר* | עד *שש* *עשרה* שעות | בלי *הפסקה.* | ובתכל׳ס, | לא היה להם | *כלום* עליי."
      pause_before: {"ובתכל׳ס": 2.0}   # השעות בחדר החקירות: שעון, זמזום, שקט

    - id: L7
      audio: voice_raw/line7.mp3
      gap: 2.8
      direction: "[quiet, restrained, tired voice]"
      tts: "אחרי עשרים וארבע שעות שחררו אותי. החלטתי לעשות הפסקה עד השחרור."
      placeholder: {cps: 9, pause: 0.6}
      text: "אחרי עשרים וארבע שעות שחררו אותי. / החלטתי לעשות הפסקה עד השחרור."
      captions: "אחרי *עשרים* *וארבע* שעות | *שחררו* אותי. | החלטתי לעשות *הפסקה* | עד השחרור."

    - id: L8
      audio: voice_raw/line8.mp3
      gap: 3.0                  # השקט של הבוקר נשאר אחרי המשפט
      direction: "[low, slow, decisive voice, with quiet confidence]"
      tts: "אבל ביום השחרור החלטתי שזהו. עכשיו הגיע הזמן שלי להשתלט על התחום."
      text: "אבל ביום השחרור החלטתי שזהו. / עכשיו הגיע הזמן שלי להשתלט על התחום."
      captions: "אבל ביום *השחרור* | החלטתי *שזהו.* | עכשיו הגיע הזמן שלי | *להשתלט* על *התחום.*"

marks:
  stop: "L3:הכול.end"            # הבס של המועדון נעצר בסוף "ששינה הכול"
  blackout: "L8:end+3.0"          # עוד פעימה על המבט, ואז שחור

blackout: blackout
blackout_fade: 0

title_card: {at: 0.25, until: 4.0}

