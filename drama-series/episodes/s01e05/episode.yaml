  - {kind: steps_heavy, at: S02,              until: S03, gain: 0.1}                     # מגפיים בחצר
  - {kind: street,      at: S02,              until: S04, gain: 0.05, fade_out: 0.3}
  - {kind: room_tone,   at: S04,              until: S05, gain: 0.08}
  - {kind: lighter,     at: "S04+0.35",       gain: 0.25}                                # מעשנים בבסיס
  - {kind: crinkle,     at: "L2:כסף-0.1",     gain: 0.2}                                 # השטרות
  - {kind: crowd,       at: S05,              until: stop, gain: 0.22, fade_in: 0.05, fade_out: 0.03}
