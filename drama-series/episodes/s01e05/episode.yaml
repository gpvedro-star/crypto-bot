# ------------------------------------------------------------------ סאונד
music:
  bpm: 92
  gain: 0.32
  sections:
    - {style: warm,   from: 0,      to: S05, gain: 0.5, fade_out: 0.25}                   # רגוע: הקריה, הבסיס
    - {style: party,  from: S05,    to: stop, grid: S05, bpm: 124, gain: 0.8, fade_in: 0.04, fade_out: 0.03}   # הלילה: הבס נכנס בקאט
    - {style: pulse,  from: S07,    to: S09, grid: S07, gain: 0.7, fade_out: 0.6}         # הפשיטה, המשטרה הצבאית מחפשת
    - {style: freeze, from: S09,    to: S10, gain: 0.35, fade_in: 0.4}                    # המרפאה, החודש בחוץ
    - {style: pulse,  from: S10,    to: S11, grid: S10, gain: 0.75}                       # חזרה לבסיס
    - {style: dark,   from: S11,    to: S12, gain: 0.22, fade_in: 0.5}                    # החקירה, כמעט בלי מוזיקה
    - {style: warm,   from: S13,    to: blackout, gain: 0.5, fade_in: 0.8}                # יום השחרור

