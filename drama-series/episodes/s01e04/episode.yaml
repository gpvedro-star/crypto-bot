# ------------------------------------------------------------------ קריינות
narration:
  voice: {provider: "Higgsfield · ElevenLabs v4", name: "Orion", voice_id: "ed69c516-92d2-4b30-a967-617737a342e5", stability: 0.35}
  start: 0.4                  # פותחים ישר על אלכס
  gap: 0.6
  lines:
    - id: L1
      audio: voice_raw/line1.mp3
      direction: "[warm, personal voice, with quiet pride]"
      text: "תכירו את חבר שלי, / אלכס. / אלכס היה אחד הילדים הכי חזקים והכי איכותיים שפגשתי. / תמיד היה הראשון לבוא לעזור. / הוא עבר גיבוש ליחידה סודית בצבא. / כולם היו תופסים ממנו. / וכולם גם היו מפחדים ממנו."
      captions: "תכירו את חבר שלי, *אלכס.* | *אלכס* היה אחד הילדים | הכי *חזקים* | והכי איכותיים שפגשתי. | תמיד היה הראשון | לבוא *לעזור.* | הוא עבר *גיבוש* | ליחידה סודית בצבא. | כולם היו *תופסים* ממנו. | וכולם גם היו | *מפחדים* ממנו."

    - id: L2
      audio: voice_raw/line2.mp3
      gap: 0.95                 # המבט של אלכס נשאר עוד חצי פעימה
      direction: "[warm, nostalgic, smiling]"
      text: "אני זוכר, כשאלכס חגג שמונה עשרה, נסענו כל החברים לאילת. / גם לחגוג לו יום הולדת וגם לחגוג איתו לפני הגיוס. / ידענו שלא נראה אותו תקופה. / סגרנו וילה מטורפת באילת. / הבאנו אוכל, שתייה, אלכוהול בהרמות וכמובן סמים. / מלא סמים."
      captions: "אני זוכר, | כשאלכס חגג | *שמונה* עשרה, | *נסענו* כל החברים לאילת. | גם לחגוג לו | *יום* *הולדת* | וגם לחגוג איתו | לפני *הגיוס.* | ידענו שלא נראה | אותו *תקופה.* | סגרנו וילה *מטורפת* באילת. | הבאנו אוכל, שתייה, | אלכוהול בהרמות | וכמובן *סמים.* | מלא *סמים.*"

    - id: L3
      audio: voice_raw/line3.mp3
      gap: 0.7
      direction: "[low, matter-of-fact voice]"
      text: "בזמן שאנחנו חוגגים בווילה, / קיבלתי טלפון מאחד האנשים שלי מצפון תל אביב. / הוא ביקש שאני אעזור לחבר שלו באילת. / כמובן שהסכמתי. / עליתי על מונית ונסעתי אליו."
      captions: "בזמן שאנחנו | חוגגים *בווילה,* | *קיבלתי* טלפון | מאחד האנשים שלי | *מצפון* *תל* *אביב.* | הוא ביקש שאני אעזור | לחבר שלו *באילת.* | כמובן *שהסכמתי.* | עליתי על *מונית* | ונסעתי אליו."

    - id: L4
      audio: voice_raw/line4.mp3
      gap: 1.5                  # רגע עם רחש הנסיעה לפני הסוויטה
      direction: "[low voice, impressed, almost in awe]"
      text: "הוא הכניס אותי לסוויטה מלכותית במלון הכי מפואר באילת. / שם הבנתי, / בפעם הראשונה, / מה זה עושר אמיתי. / מה זה כמויות של כסף. / הבחורות הכי יפות שראיתי ישבו בבגדי ים על כיסאות השיזוף במרפסת הענקית שמשקיפה על כל הטיילת. / בקבוקים של האלכוהול הכי יוקרתי שיש. / ביקשו ממני לעזור להם עם משהו לעשן. / כמובן שהסכמתי."
      captions: "הוא הכניס אותי | לסוויטה *מלכותית* | במלון הכי *מפואר* באילת. | שם הבנתי, | בפעם הראשונה, | מה זה *עושר* אמיתי. | מה זה כמויות | של *כסף.* | הבחורות הכי יפות | שראיתי ישבו | בבגדי ים | על כיסאות השיזוף | במרפסת *הענקית* | שמשקיפה על כל הטיילת. | בקבוקים של האלכוהול | הכי *יוקרתי* שיש. | ביקשו ממני לעזור להם | עם משהו *לעשן.* | כמובן *שהסכמתי.*"
      splits: [3.965, 5.13, 6.27, 7.94, 10.035, 16.67, 19.49, 22.01]   # נבדק ידנית

    - id: L5
      audio: voice_raw/line5.mp3
      gap: 2.75                 # הצלצול השני נגמר לפני המשפט
      direction: "[low voice, slowing down]"
      text: "ותוך כדי אני מקבל טלפון, / מהחבר׳ה שלי."
      captions: "ותוך כדי | אני מקבל *טלפון,* | מהחבר׳ה שלי."

    - id: L6                    # קול מהטלפון: חבר אחר, בפאניקה, דרך פילטר טלפון
      audio: voice_raw/line6.mp3
      gap: 0.35
      voice: {name: "Bram", voice_id: "549ff70a-3ee7-4f04-a4d9-89a24fab7709"}
      direction: "[panicked, shouting into the phone, out of breath]"
      filter: phone
      placeholder: {cps: 12, pause: 0.25}
      text: "דין, בוא מהר! / אלכס נרצח!"
      captions: "דין, בוא מהר! | אלכס נרצח!"
      caption_color: "#C9D3DA"   # קול הטלפון בגוון אחר מהקריין
      caption_still: true         # "אלכס נרצח" בלי תנועה

    - id: L7
      audio: voice_raw/line7.mp3
      gap: 0.6
      direction: "[quiet, in shock]"
      placeholder: {cps: 8.5, pause: 0.5}
      text: "באותו רגע ראיתי שחור. / לא הבנתי."
      captions: "באותו רגע | ראיתי *שחור.* | לא *הבנתי.*"
      pause_before: {"לא": 0.6}   # "לא הבנתי" כבר על דין שיוצא מהסוויטה

    - id: L8
      audio: voice_raw/line8.mp3
      gap: 1.6                  # הצעדים במסדרון לפני הפלאשבק
      direction: "[low, heavy, restrained voice]"
      placeholder: {cps: 10, pause: 0.45}
      text: "בזמן שהייתי במלון עם הבחורים מתל אביב, / החבר׳ה שלי הסתכסכו עם השכנים בווילה ליד. / כשאלכס בא להרגיע את העניינים, / אחד השכנים דקר אותו בלב."
      captions: "בזמן שהייתי במלון | עם הבחורים *מתל* *אביב,* | החבר׳ה שלי *הסתכסכו* | עם השכנים בווילה ליד. | כשאלכס בא *להרגיע* | את העניינים, | אחד השכנים | *דקר* אותו בלב."

marks:
  stop: "L6:אלכס-0.3"            # המוזיקה נעצרת רגע לפני "אלכס נרצח"
  blackout: "S19+4.0"

blackout: blackout
blackout_fade: 0

title_card: {at: 0.25, until: 4.0}

