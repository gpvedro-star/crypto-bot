  - {kind: ringtone,    at: "L3:קיבלתי-0.35", reps: 1, gain: 0.22}                      # שיחה ראשונה: צלצול קצר
  - {kind: taxi,        at: S09,              until: S10, gain: 0.3, fade_in: 0.1, fade_out: 0.3}
