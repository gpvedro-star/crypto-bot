# Netlify configuration for the NUVORA site (lives in the nuvora/ subfolder).
[build]
  base    = "nuvora"
  command = "npm run build"
  # `publish` in netlify.toml is resolved from the repository root, not from `base`.
  publish = "nuvora/.next"

[build.environment]
  NODE_VERSION = "22"

# The official Next.js runtime (also a devDependency of nuvora/).
[[plugins]]
  package = "@netlify/plugin-nextjs"
